name: Production release

# Pushing a tag like v1.2.3 runs a production Android build on EAS,
# converts the AAB to a signed universal APK, and publishes both on a
# GitHub release named after the tag.
#
# Required repository secrets:
#   EXPO_TOKEN                 Expo access token (https://expo.dev/settings/access-tokens)
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore.
#                              Reuse the same keystore as local builds so the
#                              APK installs as an update: base64 -w0 <keystore>
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# Note: the APK is signed with YOUR key for direct installs. Play Store
# releases should use the attached AAB, which carries the EAS upload key.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync app version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.version=process.env.VERSION;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"

      - name: EAS production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx -y eas-cli@latest build --platform android --profile production --non-interactive --wait --json > build.json
          python3 - <<'EOF'
          import json
          with open('build.json') as fh:
              data = json.load(fh)
          builds = data if isinstance(data, list) else [data]
          urls = []
          def walk(o):
              if isinstance(o, str) and o.startswith('http'):
                  urls.append(o)
              elif isinstance(o, dict):
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          for b in builds:
              walk(b.get('artifacts', b))
          aab = next((u for u in urls if '.aab' in u), None)
          if not aab:
              raise SystemExit('No AAB artifact URL found in build.json')
          print(f"AAB_URL={aab.split('?')[0]}")
          with open('aab_url.txt', 'w') as fh:
              fh.write(aab)
          EOF
          echo "AAB_URL=$(cat aab_url.txt)" >> "$GITHUB_ENV"

      - name: Download AAB
        run: curl -sSL -o app.aab "$AAB_URL"

      - name: Download bundletool
        run: curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar

      - name: Install Android build-tools
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"

      - name: Convert AAB to signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/36.0.0"
          java -jar bundletool.jar build-apks --bundle=app.aab --output=app.apks --mode=universal
          unzip -p app.apks universal.apk > "dwellio-${TAG}.apk"
          "$BT"/apksigner sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "dwellio-${TAG}-signed.apk" "dwellio-${TAG}.apk"
          mv "dwellio-${TAG}-signed.apk" "dwellio-${TAG}.apk"
          "$BT"/apksigner verify "dwellio-${TAG}.apk"
          "$BT"/zipalign -c -p 4 "dwellio-${TAG}.apk"
          "$BT"/zipalign -c -P 16 4 "dwellio-${TAG}.apk"
          cp app.aab "dwellio-${TAG}.aab"
          ls -la "dwellio-${TAG}.apk" "dwellio-${TAG}.aab"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "dwellio-${TAG}.apk" "dwellio-${TAG}.aab" \
            --title "Dwellio $TAG" \
            --generate-notes
